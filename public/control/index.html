<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020">
<title>Pookie Play — Control Panel</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1020;color:#f7f8ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#28205a 0,transparent 55%),#0b1020}
main{width:min(100%,440px);text-align:center;padding:34px 26px;border:1px solid #29324a;border-radius:24px;background:#131a2b;box-shadow:0 24px 80px #0008}
.logo{margin:0 auto 14px;width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:#7564e8;font-size:30px}
h1{font-size:27px;margin:0 0 8px}p{color:#aeb8ce;line-height:1.6;margin:0 0 24px}
.status{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border:1px solid #303a54;background:#0d1424;border-radius:14px;margin:0 0 18px;font-weight:800}
.dot{width:10px;height:10px;border-radius:50%;background:#8993a8}.dot.online{background:#42d6a0;box-shadow:0 0 0 5px #42d6a020}.dot.starting{background:#f3bd57;box-shadow:0 0 0 5px #f3bd5720}
button{width:100%;border:0;border-radius:14px;padding:16px;background:linear-gradient(100deg,#9383ff,#6755dc);color:white;font-size:15px;font-weight:800;cursor:pointer}
button:disabled{background:#263149;color:#8994aa;cursor:not-allowed}
#message{font-size:13px;color:#aeb8ce;min-height:24px;margin:16px 0 0}
.small{font-size:11px;color:#74809a;margin:18px 0 0}
</style>
</head>
<body><main>
<div class="logo">♫</div>
<h1>POOKIE PLAY</h1>
<p>তোমার Discord মিউজিক বটের Mini Control Panel</p>
<div class="status"><span id="dot" class="dot"></span><span id="state">অবস্থা দেখা হচ্ছে…</span></div>
<button id="action" type="button" disabled>স্ট্যাটাস দেখা হচ্ছে…</button>
<div id="message" role="status" aria-live="polite">GitHub Actions থেকে অবস্থা নেওয়া হচ্ছে…</div>
<div class="small">এখান থেকে শুধু বট চালু করা যাবে। বন্ধ করার কোনো কন্ট্রোল নেই।</div>
</main>
<script>
const stateEl=document.getElementById("state"),dot=document.getElementById("dot"),action=document.getElementById("action"),message=document.getElementById("message");
let active=false, busy=false;
async function refresh(){
 try{
  const response=await fetch("/api/status",{cache:"no-store"});
  const raw=await response.text();let data;try{data=JSON.parse(raw)}catch{throw new Error("API থেকে JSON পাওয়া যায়নি (HTTP "+response.status+")। Cloudflare Worker deployment বা API route পরীক্ষা করো।")};
  if(!response.ok||data.state==="unknown"||data.state==="setup_required"){const detail=[data.message,data.githubStatus?"HTTP "+data.githubStatus:"",data.detail].filter(Boolean).join(" — ");throw new Error(detail||"স্ট্যাটাস পাওয়া যাচ্ছে না।");}
  active=Boolean(data.active);
  if(active){
   dot.className="dot "+(data.state==="starting"?"starting":"online");
   stateEl.textContent=data.state==="starting"?"Pookie Play is starting…":"Pookie Play is already running.";
   action.disabled=true;action.textContent=data.state==="starting"?"বট চালু হচ্ছে…":"বট ইতিমধ্যে চালু আছে";
   message.textContent="বট চালু থাকা অবস্থায় আবার Start করা যাবে না।";
  }else{
   dot.className="dot";stateEl.textContent="Pookie Play is offline.";
   action.disabled=busy;action.textContent=busy?"Start request পাঠানো হচ্ছে…":"Start Bot";
   message.textContent="বট বন্ধ আছে। Start Bot চাপলে GitHub Actions চালু হবে।";
  }
 }catch(error){
  dot.className="dot";stateEl.textContent="Status unavailable";action.disabled=true;
  action.textContent="এখন Start করা যাচ্ছে না";message.textContent=error.message||"কিছুক্ষণ পর আবার চেষ্টা করো।";
 }
}
action.addEventListener("click",async()=>{
 if(active||busy)return;
 busy=true;action.disabled=true;action.textContent="Starting…";message.textContent="GitHub Actions-এ Start request পাঠানো হচ্ছে…";
 try{
  const response=await fetch("/api/start",{method:"POST",headers:{"Content-Type":"application/json"}});
  const raw=await response.text();let data;try{data=JSON.parse(raw)}catch{throw new Error("API থেকে JSON পাওয়া যায়নি (HTTP "+response.status+")। Cloudflare Worker deployment বা API route পরীক্ষা করো।")};
  if(response.status===409&&data.alreadyRunning){message.textContent="বট ইতিমধ্যে চালু আছে।";active=true;}
  else if(!response.ok)throw new Error(data.error||"Start request ব্যর্থ হয়েছে।");
  else message.textContent="Start request সফলভাবে পাঠানো হয়েছে। বট চালু হতে একটু সময় লাগতে পারে।";
 }catch(error){message.textContent=error.message||"Start request পাঠানো যায়নি।";}
 finally{busy=false;await refresh();}
});
refresh();setInterval(refresh,10000);
</script>
</body></html>
