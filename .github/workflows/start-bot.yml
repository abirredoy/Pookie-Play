name: Pookie Play Bot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pookie-play-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check private Lavalink connection settings
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          PRIVATE_LAVALINK_HOST: ${{ secrets.PRIVATE_LAVALINK_HOST }}
          PRIVATE_LAVALINK_PASSWORD: ${{ secrets.PRIVATE_LAVALINK_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "$TAILSCALE_AUTHKEY" ] || [ -z "$PRIVATE_LAVALINK_HOST" ] || [ -z "$PRIVATE_LAVALINK_PASSWORD" ]; then
            echo "::error::Add TAILSCALE_AUTHKEY, PRIVATE_LAVALINK_HOST and PRIVATE_LAVALINK_PASSWORD to GitHub Actions repository secrets."
            exit 1
          fi

      - name: Connect GitHub runner to private Tailscale network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install bot dependencies
        run: npm install

      - name: Validate bot JavaScript syntax
        run: node --check src/index.js

      - name: Start Pookie Play with public Lavalink fallback
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          LAVALINK_HOST: lavalink.cloudewave.in:2336
          LAVALINK_PASSWORD: cloudewave.in
          LAVALINK_SECURE: "false"
          PRIVATE_LAVALINK_HOST: ${{ secrets.PRIVATE_LAVALINK_HOST }}
          PRIVATE_LAVALINK_PASSWORD: ${{ secrets.PRIVATE_LAVALINK_PASSWORD }}
          PRIVATE_LAVALINK_SECURE: "false"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Using CloudeWave's shared public Lavalink v4 node..."
          echo "Host: ${LAVALINK_HOST}"
          echo "Starting Pookie Play..."

          if [ -z "$DISCORD_TOKEN" ] || [ -z "$CLIENT_ID" ]; then
            echo "Missing repository secrets: DISCORD_TOKEN and/or CLIENT_ID"
            exit 1
          fi

          npm start
