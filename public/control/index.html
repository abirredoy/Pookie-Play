<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b14" />
  <title>Pookie Play Bot Controller</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4 font-sans selection:bg-indigo-500 selection:text-white">
  <div class="max-w-lg w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-8 shadow-2xl shadow-indigo-950/20 text-center relative overflow-hidden">
    <div class="absolute top-4 right-6 text-xs text-slate-400 font-mono bg-slate-950/60 px-3 py-1 rounded-full border border-slate-800" id="liveClock">লোড হচ্ছে...</div>
    <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400 mb-1">Pookie Play Bot</h1>
    <p class="text-slate-400 text-sm mb-6">সার্ভার ও বট লাইভ কন্ট্রোল প্যানেল</p>
    <div id="statusBox" class="p-6 rounded-2xl bg-slate-950/80 border border-slate-800/80 mb-6 transition-all duration-300">
      <p id="statusText" class="text-lg font-semibold text-slate-300 mb-3">স্ট্যাটাস চেক করা হচ্ছে...</p>
      <div id="metaDetails" class="grid grid-cols-2 gap-3 text-xs text-slate-400 border-t border-slate-800/60 pt-4 mt-2 text-left hidden">
        <div><span class="block text-slate-500">শুরুর সময় / স্থায়িত্ব:</span><span id="runDuration" class="font-mono text-emerald-400 font-medium">-</span></div>
        <div><span class="block text-slate-500">শেষ বন্ধ হওয়ার সময়:</span><span id="stoppedAgo" class="font-mono text-slate-300 font-medium">-</span></div>
      </div>
    </div>
    <button id="startBtn" disabled class="hidden w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 active:scale-95 transition font-bold text-white shadow-lg shadow-emerald-900/30 cursor-pointer text-base disabled:opacity-50 disabled:cursor-not-allowed">▶ স্টার্ট ওয়ার্কফ্লো</button>
    <p id="msgText" class="mt-4 text-sm font-medium" role="status" aria-live="polite"></p>
    <p class="mt-5 text-xs text-slate-500"><i class="fa-solid fa-lock"></i> নিরাপদ Backend সংযোগ • কোনো Token এই পেজে রাখা নেই</p>
  </div>
<script>
const $ = id => document.getElementById(id);
const statusText=$('statusText'), statusBox=$('statusBox'), startBtn=$('startBtn');
const msgText=$('msgText'), liveClock=$('liveClock'), metaDetails=$('metaDetails');
const runDuration=$('runDuration'), stoppedAgo=$('stoppedAgo');
let active=false, busy=false, lastData=null;
function updateClock(){liveClock.textContent=new Date().toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function duration(ms){if(!Number.isFinite(ms)||ms<0)return '—';const sec=Math.floor(ms/1000),m=Math.floor(sec/60),h=Math.floor(m/60);if(h)return h+' ঘণ্টা '+m%60+' মিনিট';if(m)return m+' মিনিট '+sec%60+' সেকেন্ড';return sec+' সেকেন্ড';}
function showError(message){active=false;statusBox.className='p-6 rounded-2xl bg-rose-950/30 border border-rose-700/50 mb-6';statusText.textContent=message||'স্ট্যাটাস পাওয়া যাচ্ছে না';startBtn.classList.remove('hidden');startBtn.disabled=true;startBtn.textContent='এখন Start করা যাচ্ছে না';metaDetails.classList.add('hidden');}
function render(data){lastData=data;active=!!data.active;metaDetails.classList.remove('hidden');if(active){startBtn.classList.add('hidden');statusBox.className='p-6 rounded-2xl bg-amber-950/30 border border-amber-500/40 mb-6 shadow-lg shadow-amber-950/20';statusText.innerHTML='<span class="inline-block w-3 h-3 rounded-full bg-amber-400 animate-ping mr-2"></span><span class="text-amber-300 font-bold">রান ওয়ার্কফ্লো ইজ অলরেডি রানিং</span>';const started=data.lastRunStartedAt?new Date(data.lastRunStartedAt).getTime():NaN;runDuration.textContent=Number.isFinite(started)?'চলছে: '+duration(Date.now()-started):'চলছে';stoppedAgo.textContent='বট বর্তমানে লাইভ আছে';}else{statusBox.className='p-6 rounded-2xl bg-slate-950/80 border border-slate-800/80 mb-6';statusText.innerHTML='<span class="inline-block w-3 h-3 rounded-full bg-slate-500 mr-2"></span><span class="text-slate-300">বট বর্তমানে বন্ধ আছে</span>';runDuration.textContent='নিষ্ক্রিয়';if(data.lastRunCompletedAt){const ended=new Date(data.lastRunCompletedAt).getTime();stoppedAgo.textContent=duration(Date.now()-ended)+' আগে বন্ধ হয়েছে';}else stoppedAgo.textContent='রেকর্ড নেই';startBtn.classList.remove('hidden');startBtn.disabled=busy;startBtn.textContent=busy?'রিকোয়েস্ট পাঠানো হচ্ছে...':'▶ স্টার্ট ওয়ার্কফ্লো';}}
async function checkStatus(){try{const res=await fetch('/api/status',{cache:'no-store'});const data=await res.json();if(!res.ok||data.state==='unknown'||data.state==='setup_required')throw new Error(data.detail||data.message||'সার্ভার সংযোগে সমস্যা');render(data);}catch(e){showError(e.message==='Failed to fetch'?'নেটওয়ার্ক কানেকশন পাওয়া যাচ্ছে না!':e.message);}}
async function startWorkflow(){if(active||busy)return;busy=true;startBtn.disabled=true;startBtn.textContent='রিকোয়েস্ট পাঠানো হচ্ছে...';msgText.textContent='';try{const res=await fetch('/api/start',{method:'POST'});const data=await res.json().catch(()=>({}));if(res.status===409&&data.alreadyRunning){msgText.className='mt-4 text-sm text-amber-400 font-medium';msgText.textContent='রান ওয়ার্কফ্লো ইজ অলরেডি রানিং';}else if(!res.ok){throw new Error(data.detail||data.error||'Start request ব্যর্থ হয়েছে');}else{msgText.className='mt-4 text-sm text-emerald-400 font-medium';msgText.textContent='ওয়ার্কফ্লো সফলভাবে চালু করার রিকোয়েস্ট পাঠানো হয়েছে!';}}catch(e){msgText.className='mt-4 text-sm text-rose-400 font-medium';msgText.textContent=e.message||'সার্ভার রিকোয়েস্ট ব্যর্থ হয়েছে!';}finally{busy=false;await checkStatus();}}
startBtn.addEventListener('click',startWorkflow);updateClock();setInterval(updateClock,1000);checkStatus();setInterval(checkStatus,7000);
</script>
</body>
</html>
