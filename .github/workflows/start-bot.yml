name: Pookie Play Bot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pookie-play-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java for Lavalink
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install

      - name: Use public Lavalink nodes
        run: echo "Connecting to the public Lavalink nodes configured in src/index.js"

      - name: Start Pookie Play
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$DISCORD_TOKEN" ] || [ -z "$CLIENT_ID" ]; then
            echo "Missing repository secrets: DISCORD_TOKEN and/or CLIENT_ID"
            exit 1
          fi
          npm start
